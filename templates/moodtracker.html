{% extends "base.html" %}

{% block title %}Mood Tracker{% endblock title %}

{% block content %}
{% include 'dashboard_nav.html' %}

<section class="py-12 bg-gradient-to-br from-mint-100 to-white">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <h1 class="text-3xl font-bold text-mint-700 mb-2">Mood Tracker</h1>
    <p class="text-gray-600 text-sm mb-8">Log how you feel daily and reflect on your emotional journey.</p>
  </div>

  <div class="max-w-4xl mx-auto px-6">
    <!-- Mood Input -->
    <form method="POST" action="/moodtracker" class="bg-white rounded-xl shadow-md p-6 mb-8">
      <label for="mood" class="block text-sm font-medium text-gray-700 mb-2">How are you feeling today?</label>
      <select name="mood" id="mood" class="w-full border rounded p-2">
        <option value="😊">😊 Happy</option>
        <option value="😐">😐 Okay</option>
        <option value="😢">😢 Sad</option>
        <option value="😡">😡 Angry</option>
        <option value="😰">😰 Anxious</option>
      </select>
      <button type="submit" class="mt-4 bg-lime-500 text-black px-4 py-2 rounded hover:bg-mint-700">Log Mood</button>
    </form>

    <!-- Chart Placeholder -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Mood History</h2>
      <canvas id="moodChart" class="w-full h-64"></canvas>
    </div>
  </div>
</section>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('moodChart').getContext('2d');
  const moodChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: {{ labels|safe }},
      datasets: [{
        label: 'Mood Over Time',
        data: {{ moods|safe }},
        borderColor: '#2dd4bf',
        backgroundColor: 'rgba(45, 212, 191, 0.2)',
        tension: 0.3
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            stepSize: 1,
            callback: function(value) {
              return ['😢','😰','😐','😊','😡'][value];
            }
          }
        }
      }
    }
  });
</script>

{% endblock content %}
